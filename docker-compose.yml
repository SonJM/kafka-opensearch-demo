services:
  # Zookeeper
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - kafka-net

  # kafka Broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1                                  # 브로커 고유 번호
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181             # 주키퍼 접속 주소
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092   # 카프카 접속 주소
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT    # 프로토콜의 별칭 설정해주는 매핑 표
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT                                           # 브로커키리 소통하기 위한 채널 이름
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1           # __consumer_offset 내부 토픽 (컨슈머가 어디까지 읽었는데 offset을 저장하기 위해 사용, 기본값 3)
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1   # 트랜잭션 상태를 저장하는 내부 로그의 복제본 개수 (기본값 3)
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1              # 트랜잭션 로그 작성 성공에 대한 최소 성공 브로커 개수(기본값 2)
      KAFKA_MIN_INSYNC_REPLICAS: 1                        # 데이터 전송 성공 여부를 체크하기 위한 최소 성공 브로커 개수
      KAFKA_NUM_PARTITIONS: 3                             # 각 토픽 내 파티션 개수
    networks:
      - kafka-net

  # kafka UI
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - kafka-net

  # OpenSearch
  opensearch:
    image: opensearchproject/opensearch:2.16.0
    environment:
      - discovery.type=single-node
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_SECURITY_PLUGIN=true
    ports:
      - "9200:9200"
      - "9600:9600"
    networks:
      - kafka-net

  # OpenSearch Dashboards
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.16.0
    ports:
      - "5601:5601"
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    depends_on:
      - opensearch
    networks:
      - kafka-net
  
  # Service W1
  w1-service:
    build: .
    image: my-log-service:latest
    environment:
      APP_ROLE: W1
      INPUT_TOPIC: topic-a
      OUTPUT_TOPIC_1: topic-b
      OUTPUT_TOPIC_2: topic-c
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OPENSEARCH_URIS: http://opensearch:9200
    depends_on:
      - kafka
      - opensearch
    networks:
      - kafka-net

  # Service W2
  w2-service:
    image: my-log-service:latest
    environment:
      APP_ROLE: W2
      INPUT_TOPIC: topic-b
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OPENSEARCH_URIS: http://opensearch:9200
    depends_on:
      - kafka
      - opensearch
    networks:
      - kafka-net

  # Service W3
  w3-service:
    image: my-log-service:latest
    environment:
      APP_ROLE: W3
      INPUT_TOPIC: topic-c
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OPENSEARCH_URIS: http://opensearch:9200
    depends_on:
      - kafka
      - opensearch
    networks:
      - kafka-net

  # Log Generator
  log-generator:
    image: confluentinc/cp-kafka:7.5.0
    container_name: log-generator
    depends_on:
      - kafka
    entrypoint:
      - bash
      - -c
      - |
        echo 'Waiting for Kafka to be ready...'
        sleep 30
        
        echo 'Creating topic if not exists...'
        kafka-topics --create --topic topic-a --bootstrap-server kafka:29092 --partitions 1 --replication-factor 1 --if-not-exists
        
        echo 'Start generating logs...'
        while true; do
          echo "Log-$$(date +%s)-$$RANDOM" | kafka-console-producer --bootstrap-server kafka:29092 --topic topic-a
          sleep 1
        done
    networks:
      - kafka-net

networks:
  kafka-net:
    driver: bridge