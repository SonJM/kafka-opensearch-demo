apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-generator
  namespace: kafka-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-generator
  template:
    metadata:
      labels:
        app: log-generator
    spec:
      containers:
        - name: generator
          image: apache/kafka:4.1.1
          command: ["/bin/bash", "-c"]
          args:
            - |
              echo 'Waiting for Kafka to be ready...'
              sleep 10
              
              echo 'Start generating logs to topic-a...'
              while true; do
                MSG="Log-$(date +%s)-$RANDOM"
                echo $MSG | /opt/kafka/bin/kafka-console-producer.sh --bootstrap-server kafka-headless:9092 --topic topic-a
                echo "Sent: $MSG"
                
                # [DEMO CONFIGURATION]
                # 빠른 Lag 생성을 위해 대기 시간을 0.1초로 단축
                sleep 0.1
                
                # [PRODUCTION RESTORE]
                # 실제 테스트나 운영 시에는 부하 수준에 맞춰 조정 (예: sleep 1)
              done
