apiVersion: v1
kind: Service
metadata:
  name: opensearch
  namespace: kafka-demo
  labels:
    app: opensearch
spec:
  ports:
    - port: 9200
      name: http
    - port: 9600
      name: transport
  selector:
    app: opensearch

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opensearch
  namespace: kafka-demo
spec:
  serviceName: "opensearch"
  replicas: 1
  selector:
    matchLabels:
      app: opensearch
  template:
    metadata:
      labels:
        app: opensearch
    spec:
      containers:
        - name: opensearch
          image: opensearchproject/opensearch:2.16.0
          ports:
            - containerPort: 9200
            - containerPort: 9600
          env:
            - name: discovery.type
              value: "single-node"
            - name: DISABLE_SECURITY_PLUGIN
              value: "true"
            - name: OPENSEARCH_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
          volumeMounts:
            - name: opensearch-data
              mountPath: /usr/share/opensearch/data
  volumeClaimTemplates:
    - metadata:
        name: opensearch-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 1Gi
