{{- range .Values.apps }}
{{- if .name }}
---
# Service {{ .name }} Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app: {{ .name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .name }}
  template:
    metadata:
      labels:
        app: {{ .name }}
    spec:
      containers:
        - name: app
          # Global Registry 설정이 있으면 앞에 붙임
          image: "{{ if $.Values.global.registry }}{{ $.Values.global.registry }}/{{ end }}{{ .image.repository }}:{{ .image.tag }}"
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_ROLE
              value: "{{ .role }}"
          envFrom:
            - configMapRef:
                name: app-config
          ports:
            - containerPort: 8080
---
# Service {{ .name }} Service (ClusterIP)
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
spec:
  selector:
    app: {{ .name }}
  ports:
    - port: 80
      targetPort: 8080
{{- end }}
{{- end }}
