apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensearch
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opensearch
  template:
    metadata:
      labels:
        app: opensearch
    spec:
      containers:
        - name: opensearch
          image: "{{ if .Values.global.registry }}{{ .Values.global.registry }}/{{ end }}{{ .Values.opensearch.image.repository }}:{{ .Values.opensearch.image.tag }}"
          imagePullPolicy: {{ .Values.opensearch.image.pullPolicy | default "IfNotPresent" }}
          env:
            - name: discovery.type
              value: single-node
            - name: plugins.security.disabled
              value: "true" # 데모용 보안 비활성화
          ports:
            - containerPort: 9200
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: opensearch
  ports:
    - port: 9200
      targetPort: 9200
