apiVersion: v1
kind: Service
metadata:
  name: w1-service
  namespace: kafka-demo
spec:
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30081
      name: http
  selector:
    app: w1-service

